# Keeps the Render free-tier server warm by pinging /health every 5 minutes.
# Render sleeps web services after ~15 min without traffic; this prevents cold starts.
# Manual run: Actions tab → keep-alive → Run workflow.
name: keep-alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health
        run: curl -fsS --max-time 60 https://server-d3od.onrender.com/health
